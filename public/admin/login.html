<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Spa Booking</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #f3f4f6; }
    .glass {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen">

  <div class="glass w-full max-w-sm p-8 rounded-2xl shadow-xl">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-gray-800">Spa Admin</h1>
      <p class="text-sm text-gray-500 mt-1">Vui lòng nhập mật khẩu để tiếp tục</p>
    </div>

    <form id="login-form" class="space-y-6">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Mật khẩu Quản trị</label>
        <input type="password" id="password" required
          class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-purple-500 transition-shadow bg-white/50" 
          placeholder="••••••••">
      </div>
      
      <div id="error-msg" class="hidden text-sm text-red-500 font-medium"></div>

      <button type="submit" id="submit-btn"
        class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded-xl transition-colors shadow-lg shadow-purple-200">
        Đăng nhập
      </button>
    </form>
  </div>

  <script>
    // Redirect if already logged in
    if (localStorage.getItem('adminToken')) {
      window.location.href = '/admin/index';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submit-btn');
      const errorMsg = document.getElementById('error-msg');
      
      btn.textContent = 'Đang xử lý...';
      btn.disabled = true;
      errorMsg.classList.add('hidden');

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        
        const data = await res.json();
        
        if (data.success) {
          localStorage.setItem('adminToken', data.token);
          window.location.href = '/admin/index';
        } else {
          errorMsg.textContent = data.message || 'Sai mật khẩu!';
          errorMsg.classList.remove('hidden');
        }
      } catch (err) {
        errorMsg.textContent = 'Lỗi kết nối máy chủ';
        errorMsg.classList.remove('hidden');
      } finally {
        btn.textContent = 'Đăng nhập';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
