<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Spa Booking</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="/admin-manifest.json">
</head>
<body class="bg-gray-50 min-h-screen">
  
  <!-- Navigation -->
  <nav class="bg-white border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16">
        <div class="flex items-center">
          <span class="text-xl font-bold text-purple-600">Spa Admin</span>
          <div class="ml-10 flex space-x-4">
            <a href="/admin/index" class="bg-purple-100 text-purple-700 px-3 py-2 rounded-md text-sm font-medium">Lịch hẹn</a>
            <a href="/admin/settings" class="text-gray-500 hover:text-gray-700 px-3 py-2 rounded-md text-sm font-medium">Cài đặt Dịch vụ & Khóa lịch</a>
          </div>
        </div>
        <div class="flex items-center">
          <button onclick="logout()" class="text-gray-500 hover:text-gray-700 text-sm font-medium">Đăng xuất</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-gray-900">Quản lý Lịch Hẹn</h1>
      <button onclick="openManualBookingModal()" class="bg-purple-600 text-white px-4 py-2 rounded-lg font-medium shadow-sm hover:bg-purple-700 transition">
        + Thêm lịch thủ công
      </button>
    </div>

    <!-- Filters -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-6 flex flex-wrap gap-4 items-end">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Ngày hẹn</label>
        <input type="date" id="filter-date" class="border-gray-300 rounded-lg shadow-sm focus:ring-purple-500 focus:border-purple-500 px-3 py-2 border">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Trạng thái</label>
        <select id="filter-status" class="border-gray-300 rounded-lg shadow-sm focus:ring-purple-500 focus:border-purple-500 px-3 py-2 border">
          <option value="">Tất cả</option>
          <option value="confirmed" selected>Đã xác nhận</option>
          <option value="completed">Đã làm xong</option>
          <option value="cancelled">Đã hủy</option>
        </select>
      </div>
      <button onclick="loadBookings()" class="bg-gray-100 text-gray-700 px-4 py-2 rounded-lg font-medium hover:bg-gray-200">Lọc</button>
    </div>

    <!-- Bookings Table -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Thời gian</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Khách hàng</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Dịch vụ</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Trạng thái</th>
            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Thao tác</th>
          </tr>
        </thead>
        <tbody id="bookings-tbody" class="bg-white divide-y divide-gray-200">
          <!-- Rows will be injected here -->
        </tbody>
      </table>
      <div id="loading" class="text-center py-10 text-gray-500">Đang tải dữ liệu...</div>
      <div id="empty-state" class="hidden text-center py-10 text-gray-500">Không có lịch hẹn nào.</div>
    </div>
  </main>

  <!-- Modal: Manual Booking -->
  <div id="manual-modal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 flex justify-center items-center z-50">
    <div class="bg-white rounded-xl p-6 w-full max-w-md shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold">Thêm Lịch Thủ Công</h2>
        <button onclick="closeManualBookingModal()" class="text-gray-400 hover:text-gray-600">✕</button>
      </div>
      <form id="manual-booking-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Tên khách hàng</label>
          <input type="text" id="m-name" required class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Số điện thoại</label>
          <input type="tel" id="m-phone" required class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Dịch vụ</label>
          <select id="m-service" required class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2"></select>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700">Ngày</label>
            <input type="date" id="m-date" required class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Giờ bắt đầu</label>
            <input type="time" id="m-time" required class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2">
          </div>
        </div>
        
        <div class="pt-2">
          <button type="submit" class="w-full bg-purple-600 text-white rounded-lg py-2 font-bold hover:bg-purple-700">
            Xác nhận đặt lịch
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('adminToken');
    if (!token) window.location.href = '/admin/login';

    // API Helpers
    const fetchApi = async (url, options = {}) => {
      const headers = {
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json',
        ...options.headers
      };
      const res = await fetch(url, { ...options, headers });
      if (res.status === 401 || res.status === 403) {
        localStorage.removeItem('adminToken');
        window.location.href = '/admin/login';
      }
      return res.json();
    };

    function logout() {
      localStorage.removeItem('adminToken');
      window.location.href = '/admin/login';
    }

    // Load Bookings
    async function loadBookings() {
      const tbody = document.getElementById('bookings-tbody');
      const loading = document.getElementById('loading');
      const emptyState = document.getElementById('empty-state');
      
      const date = document.getElementById('filter-date').value;
      const status = document.getElementById('filter-status').value;

      let url = '/api/admin/bookings?';
      if (date) url += `date=${date}&`;
      if (status) url += `status=${status}`;

      tbody.innerHTML = '';
      loading.classList.remove('hidden');
      emptyState.classList.add('hidden');

      try {
        const data = await fetchApi(url);
        loading.classList.add('hidden');

        if (data.data.length === 0) {
          emptyState.classList.remove('hidden');
          return;
        }

        data.data.forEach(b => {
          const startTime = new Date(b.start_time);
          const tr = document.createElement('tr');
          
          let statusBadge = '';
          if (b.status === 'confirmed') statusBadge = '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-blue-100 text-blue-800">Đã xác nhận</span>';
          if (b.status === 'completed') statusBadge = '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">Hoàn thành</span>';
          if (b.status === 'cancelled') statusBadge = '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-red-100 text-red-800">Đã hủy</span>';

          tr.innerHTML = `
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 font-medium">
              ${startTime.toLocaleDateString('vi-VN')} <br>
              <span class="text-purple-600">${startTime.toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'})}</span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="text-sm font-medium text-gray-900">${b.customer_name}</div>
              <div class="text-sm text-gray-500">${b.customer_phone}</div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${b.service_name}</td>
            <td class="px-6 py-4 whitespace-nowrap">${statusBadge}</td>
            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium space-x-2">
              ${b.status === 'confirmed' ? `
                <button onclick="updateStatus('${b.id}', 'completed')" class="text-green-600 hover:text-green-900">✓ Xong</button>
                <button onclick="updateStatus('${b.id}', 'cancelled')" class="text-red-600 hover:text-red-900">✕ Hủy</button>
              ` : ''}
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        alert('Lỗi tải dữ liệu');
      }
    }

    async function updateStatus(id, newStatus) {
      if (!confirm(`Xác nhận chuyển sang trạng thái: ${newStatus}?`)) return;
      const res = await fetchApi(`/api/admin/bookings/${id}/status`, {
        method: 'PATCH',
        body: JSON.stringify({ status: newStatus })
      });
      if (res.success) loadBookings();
      else alert(res.message);
    }

    // Initialization
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('filter-date').value = today;
    
    // Services for manual booking
    let servicesCache = [];
    async function loadServices() {
      const res = await fetchApi('/api/admin/services');
      if (res.success) {
        servicesCache = res.data;
        const select = document.getElementById('m-service');
        select.innerHTML = res.data.map(s => `<option value="${s.id}">${s.name} (${s.duration_minutes}p)</option>`).join('');
      }
    }

    function openManualBookingModal() {
      document.getElementById('manual-modal').classList.remove('hidden');
      document.getElementById('m-date').value = document.getElementById('filter-date').value;
    }
    function closeManualBookingModal() {
      document.getElementById('manual-modal').classList.add('hidden');
    }

    document.getElementById('manual-booking-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const sId = parseInt(document.getElementById('m-service').value);
      const svc = servicesCache.find(s => s.id === sId);
      
      const dateVal = document.getElementById('m-date').value;
      const timeVal = document.getElementById('m-time').value;
      
      const start = new Date(`${dateVal}T${timeVal}:00+07:00`);
      const end = new Date(start.getTime() + svc.duration_minutes * 60000);

      const payload = {
        customerName: document.getElementById('m-name').value,
        customerPhone: document.getElementById('m-phone').value,
        serviceId: sId,
        startTime: start.toISOString(),
        endTime: end.toISOString()
      };

      const res = await fetchApi('/api/admin/bookings/manual', {
        method: 'POST',
        body: JSON.stringify(payload)
      });

      if (res.success) {
        alert('Thêm lịch thủ công thành công!');
        closeManualBookingModal();
        loadBookings();
      } else {
        alert('Lỗi: ' + res.message);
      }
    });

    loadServices();
    loadBookings();
  </script>
</body>
</html>
